<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" role="img" aria-labelledby="title desc">
  <title id="title">A Web3 creative space</title>
  <desc id="desc">A digital studio brings together a connected wallet, a collectible, an on-chain record, and a community vote.</desc>
